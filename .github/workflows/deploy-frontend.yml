name: Deploy Frontend (Azure Static Web Apps)

# Builds the Vite SPA in client/ and deploys it to Azure Static Web Apps.
# Triggers on pushes to main that touch the client, on PRs (for preview
# environments), or manually.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'client/**'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & deploy SPA
    # Skip the build job when a PR is merely closed (only cleanup runs then).
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build & deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: client      # source of the SPA
          output_location: dist     # Vite build output (relative to app_location)
        env:
          # Point the SPA at the deployed API. Set VITE_API_URL as a repo variable,
          # e.g. https://task-manager-api.azurewebsites.net
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  close-pull-request:
    name: Close PR preview environment
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
