name: CI

# Runs on every push and pull request targeting main.
# Validates both workspaces before anything is allowed to deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server – lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          # Dummy values so modules that read env at import time don't throw.
          # Real secrets are never needed in CI; tests should not hit a live DB.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-jwt-refresh-secret
          CLIENT_URL: http://localhost:5173

  client:
    name: Client – lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Advisory for now: the existing source has pre-existing lint violations.
      # Failures are surfaced in the logs but don't block the pipeline. Remove
      # `continue-on-error` once the existing violations are cleaned up to make
      # linting a hard gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Build-time API URL. Override per-environment via repo/Environment vars.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8000' }}
